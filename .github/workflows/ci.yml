name: RIZM Agentic Energy OS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Pytest Suite
      run: |
        pytest test_suite.py -v

    - name: Execute Full RIZM Site Pipeline & Audit Export
      run: |
        python rizm_agentic_os.py --config site_config.json --run-sensitivity --export-audit

    - name: Verify Audit Ledger Artifact
      run: |
        test -f AUDIT_LEDGER.json
        test -f sensitivity_matrix_results.csv
